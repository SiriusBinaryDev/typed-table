name: Feature request
description: Propose a new capability or API improvement for typed-table.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then the proposed solution. Requests grounded in a concrete workflow are the most useful.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that the current API does not support well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, references, or implementation notes.
    validations:
      required: false
