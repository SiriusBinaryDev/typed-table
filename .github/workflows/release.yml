name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Prepare GitHub Packages mirrors
        run: node scripts/release/prepare-github-packages.mjs

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          generate_release_notes: true

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@siriusbinarydev"

      - name: Publish core mirror to GitHub Packages
        run: npm publish .github-packages/typed-table-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish adapters mirror to GitHub Packages
        run: npm publish .github-packages/typed-table-adapters
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish react mirror to GitHub Packages
        run: npm publish .github-packages/typed-table-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

